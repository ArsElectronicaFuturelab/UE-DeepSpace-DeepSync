name: Create Release with LFS

# Version source of truth: VersionName in Plugins/AefDeepSync/AefDeepSync.uplugin
# The newest entry in Plugins/AefDeepSync/CHANGELOG.md must match it.
# - push: runs when the .uplugin changes; creates tag v<VersionName> + release if the tag does not exist yet
# - workflow_dispatch: manual run on the selected branch; fails if the tag already exists

on:
  push:
    branches:
      - main
    paths:
      - Plugins/AefDeepSync/AefDeepSync.uplugin
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release title (empty = "UE <EngineVersion> Deep Space - DeepSync")'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPLUGIN: Plugins/AefDeepSync/AefDeepSync.uplugin
  CHANGELOG: Plugins/AefDeepSync/CHANGELOG.md

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read version from .uplugin
        id: version
        run: |
          VERSION=$(jq -r '.VersionName // empty' "$UPLUGIN")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=$UPLUGIN::VersionName '$VERSION' is missing or not in MAJOR.MINOR.PATCH format"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check CHANGELOG matches VersionName
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TOP=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' "$CHANGELOG" | tr -d '#[] ')
          if [ "$TOP" != "$VERSION" ]; then
            echo "::error file=$CHANGELOG::Newest entry '$TOP' does not match VersionName '$VERSION' in $UPLUGIN"
            exit 1
          fi
          echo "OK  $CHANGELOG = $TOP"

      - name: Check tag does not exist yet
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Tag $TAG already exists. Bump VersionName in $UPLUGIN first."
              exit 1
            fi
            echo "::notice::Tag $TAG already exists - nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release title
        if: steps.tag.outputs.exists == 'false'
        id: title
        env:
          INPUT_TITLE: ${{ inputs.release_title }}
        run: |
          TITLE="$INPUT_TITLE"
          if [ -z "$TITLE" ]; then
            ENGINE=$(jq -r '.EngineVersion // empty' "$UPLUGIN" | cut -d. -f1,2)
            TITLE="UE $ENGINE Deep Space - DeepSync"
          fi
          echo "title=$TITLE (${{ steps.version.outputs.tag }})" >> "$GITHUB_OUTPUT"

      - name: Create ZIP with LFS files
        if: steps.tag.outputs.exists == 'false'
        run: |
          zip -r "UE-DeepSpace-DeepSync-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*"

      - name: Create tag and release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.title.outputs.title }}
          files: UE-DeepSpace-DeepSync-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true
